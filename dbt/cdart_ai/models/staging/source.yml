version: 2

sources:
  - name: raw
    database: CDART_AI_SAAS_PLATFORM_DW
    schema: RAW

    tables:
      - name: ACCOUNTS
        columns:
          - name: account_id
            tests:
              - not_null
              - unique
          - name: account_name
            tests:
              - not_null
          - name: industry
            tests:
              - not_null
          - name: country
            tests:
              - not_null
          - name: signup_date
            tests:
              - not_null
          - name: referral_source
            tests:
              - not_null
          - name: plan_tier
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - Starter
                      - Professional
                      - Business
                      - Enterprise
          - name: is_trial
            tests:
              - not_null
          - name: churn_flag
            tests:
              - not_null

      - name: SUBSCRIPTIONS
        columns:
          - name: subscription_id
            tests:
              - not_null
              - unique

          - name: account_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'ACCOUNTS')
                    field: account_id

          - name: start_date
            tests:
              - not_null

          - name: plan_tier
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - Starter
                      - Professional
                      - Business
                      - Enterprise

          - name: seats
            tests:
              - not_null

          - name: mrr_amount
            tests:
              - not_null

          - name: arr_amount
            tests:
              - not_null

          - name: is_trial
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - true
                      - false

          - name: upgrade_flag
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - true
                      - false

          - name: downgrade_flag
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - true
                      - false

          - name: churn_flag
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - true
                      - false

          - name: billing_frequency
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - Monthly
                      - Annual

          - name: auto_renew_flag
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - true
                      - false

      - name: PAYMENTS
        columns:
          - name: payment_id
            tests:
              - not_null
              - unique
          - name: account_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'ACCOUNTS')
                    field: account_id
          - name: subscription_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'SUBSCRIPTIONS')
                    field: subscription_id
          - name: payment_date
            tests:
              - not_null
          - name: amount
            tests:
              - not_null
          - name: currency
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - USD
          - name: payment_status
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - Succeeded
                      - Failed
          - name: payment_method
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - ACH
                      - Credit Card
                      - Wire Transfer

      - name: SUPPORT_TICKETS
        columns:
          - name: ticket_id
            tests:
              - not_null
              - unique

          - name: account_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'ACCOUNTS')
                    field: account_id

          - name: submitted_at
            tests:
              - not_null

          - name: closed_at
            tests:
              - not_null

          - name: resolution_time_hours
            tests:
              - not_null

          - name: priority
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - P1 - Critical
                      - P2 - High
                      - P3 - Medium
                      - P4 - Low

          - name: first_response_time_minutes
            tests:
              - not_null

          - name: satisfaction_score
            tests:
              - not_null

          - name: escalation_flag
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - true
                      - false

      - name: AI_USAGE_EVENTS
        columns:
          - name: raw_event
            tests:
              - not_null

          - name: source_file
            tests:
              - not_null

          - name: ingested_at
            tests:
              - not_null
